name: Blender first-use runtime validation
on:
  push:
    branches: [claude/plazcode-dev]
    paths:
      - .github/workflows/test-blender-first-use.yml
      - development/1.24.31/test-blender-first-use.ps1
  workflow_dispatch:
    inputs:
      build_run:
        description: Full validation run containing the signed Windows lean ZIP
        required: true
        type: string
      installer_only:
        description: Check installer download/cache/checksum recovery before a matching native package is ready
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  clean-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare the reviewed source and existing installer checks
        run: python development/1.24.31/prepare.py
      - name: First download, cached reuse, failed checksum and recovery in Windows PowerShell 5.1
        working-directory: build-src-1.24.31/PlazCode
        run: python test-runtime-installer.py --powershell "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
      - name: Download the exact signed Windows test package
        if: github.event_name == 'workflow_dispatch' && !inputs.installer_only
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if (-not $env:BUILD_RUN) {
            $env:BUILD_RUN = gh run list --repo $env:GITHUB_REPOSITORY --workflow validate-1.24.31.yml --branch $env:GITHUB_REF_NAME --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if ($env:BUILD_RUN -notmatch '^\d+$') { throw 'A numeric build run is required.' }
          $Source = gh run view $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --json headSha --jq .headSha
          if ($Source -notmatch '^[a-f0-9]{40}$') { throw 'Build source could not be verified.' }
          git fetch --no-tags --depth=1 origin $Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $Source -- development/1.24.31/overlay/agent/src development/1.24.31/overlay/Setup-Mcp-Runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Run a full build on the current native source before testing first use.' }
          gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name plazcode-1.24.31-Windows-test-lean --dir first-use-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real packaged app with no UV installation and no UV on PATH
        if: github.event_name == 'workflow_dispatch' && !inputs.installer_only
        shell: pwsh
        run: ./development/1.24.31/test-blender-first-use.ps1 -Package "$PWD/first-use-package/PlazCode-1.24.31-test-lean.zip"
