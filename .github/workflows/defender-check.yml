# 1.24.30 (owner, 2026-10-31: a tester's Defender blocked PlazCode-1.24.29.zip as "Trojan"). Scans a published
# release asset with Microsoft Defender cloud checks on a throwaway Windows runner (samples are never uploaded), to
# tell whether a package is flagged and which file. Read-only: changes nothing in any repository.
name: Defender check of a published PlazCode download
on:
  push:
    branches: [claude/plazcode-dev]
    paths: [.github/workflows/defender-check.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in stoveez/PlazCode (for example v1.24.29)
        required: true
      asset:
        description: Asset name (for example PlazCode-1.24.29.zip)
        required: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download, then scan with cloud checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.24.29' }}
          ASSET: ${{ inputs.asset || 'PlazCode-1.24.29.zip' }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:ASSET -notmatch '^[A-Za-z0-9._-]+\.zip$') { throw 'Unexpected tag or asset name.' }
          gh release download $env:TAG --repo stoveez/PlazCode --pattern $env:ASSET --dir pkg
          Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent 2 -CloudBlockLevel High -CloudExtendedTimeout 50
          Update-MpSignature
          $scanner=Get-ChildItem 'C:/ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe' | Sort-Object FullName | Select-Object -Last 1
          $zip=Resolve-Path "pkg/$env:ASSET"
          Expand-Archive $zip -DestinationPath unpacked
          foreach ($target in @("$zip","$PWD/unpacked")) { "== $target"; & $scanner.FullName -Scan -ScanType 3 -File $target -DisableRemediation 2>&1; "exit $LASTEXITCODE" }
          "== detections"
          Get-MpThreatDetection | ForEach-Object { (Get-MpThreat -ThreatID $_.ThreatID).ThreatName + ' -> ' + ($_.Resources -join '; ') }
