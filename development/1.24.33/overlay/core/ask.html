<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ask PlazCode</title>
<style>
 :root{--a:#8b5cf6;color-scheme:dark}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#eef0f6;display:flex;flex-direction:column;height:100vh}
 header{padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
 h1{font:600 17px Georgia,"Sitka Text",Cambria,serif;margin:0 0 8px}
 .share{display:flex;gap:10px;align-items:center}
 .share canvas{width:112px;height:70px;border-radius:8px;background:#1a1d26;box-shadow:0 0 0 1px rgba(255,255,255,.1);flex:none;object-fit:cover}
 .sharing .share canvas{box-shadow:0 0 0 2px var(--a)}
 .share-txt{flex:1;min-width:0;font-size:13px}
 .share-txt b,.share-txt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .share-txt small{color:#9aa0ae}
 label.sw{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#c4c8d4;cursor:pointer}
 label.sw input{accent-color:var(--a);width:16px;height:16px}
 #banner{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px;color:#c4c8d4}
 #log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
 .msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
 .me{align-self:flex-end;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 60%,#000));color:#fff}
 .ai{align-self:flex-start;background:rgba(255,255,255,.06)}
 .note{align-self:center;color:#9aa0ae;font-size:12.5px;text-align:center}
 .error{align-self:stretch;color:#fca5a5;font-size:13px}
 .approve{align-self:stretch;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 50%,transparent)}
 .approve small{display:block;color:#9aa0ae;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
 .approve code{display:block;font-size:12px;color:#9aa0ae;margin:6px 0;white-space:pre-wrap;word-break:break-all}
 .row{display:flex;gap:8px}
 footer{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.08)}
 textarea{width:100%;min-height:62px;max-height:180px;resize:vertical;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#161922;color:#eef0f6;font:inherit;padding:9px 11px}
 textarea:focus{outline:2px solid var(--a);outline-offset:1px}
 button{font:600 14px system-ui,sans-serif;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;color:#fff;background:rgba(255,255,255,.08)}
 button.main{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 60%,#000))}
 button.stop{background:linear-gradient(135deg,#ef4444,#b91c1c)}
 button:disabled{opacity:.5;cursor:default}
 button:focus-visible{outline:2px solid #fff;outline-offset:2px}
 .send{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
 #step{font-size:12.5px;color:#9aa0ae}
</style></head>
<body>
<header>
 <h1>Ask PlazCode</h1>
 <div class="share"><canvas id="peek" width="224" height="140" aria-hidden="true"></canvas><div class="share-txt"><b id="shareTitle">Not sharing</b><small id="shareSite">Turn on sharing so PlazCode can see this tab.</small></div></div>
 <label class="sw"><input type="checkbox" id="sharing" checked> Share the tab I'm looking at</label>
 <label class="sw"><input type="checkbox" id="screen"> Share my whole screen instead</label>
 <label class="sw"><input type="checkbox" id="control"> <span id="controlText">Let PlazCode control this tab</span></label>
</header>
<div id="banner" hidden><span id="bannerText"></span> <button id="allowPerm" type="button" class="main">Allow</button></div>
<main id="log" aria-live="polite"><p class="note">Ask anything about the page you're on. PlazCode sees a picture of it with each question.</p></main>
<footer>
 <textarea id="q" placeholder="Ask about this page…" aria-label="Your question"></textarea>
 <div class="send"><span id="step" role="status"></span><span class="row"><button id="stop" type="button" class="stop" hidden>Stop</button><button id="go" type="button" class="main">Send</button></span></div>
</footer>
<script src="ask.js"></script>
</body></html>
