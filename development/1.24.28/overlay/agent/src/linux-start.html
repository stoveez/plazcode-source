<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>PlazCode</title></head>
<body style="background:#17140d;color:#f5d78f;font:18px system-ui;padding:40px"><p id="status">Opening PlazCode…</p>
<script>
(async function(){
  const ticket=location.hash.slice(1);
  history.replaceState(null,'','/desktop-start');
  try {
    const response=await fetch('/api/desktop/browser-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:ticket})});
    if(!response.ok)throw Error('This launch has expired. Open PlazCode again.');
    const boot=await response.json();boot.apiUrl=location.origin;
    sessionStorage.setItem('plazcode-linux-desktop',JSON.stringify(boot));
    location.replace('/desktop-ui');
  }catch(error){document.getElementById('status').textContent=error.message;}
})();
</script></body></html>
